<script>
const fileInput=document.getElementById("fileInput");
const downloadBtn=document.getElementById("downloadBtn");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const frame=document.getElementById("frame");

const S=4;
const sx=80*S, sy=30*S, sw=250*S, sh=544*S, r=37*S;
let shot=null;

function roundedRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);
 ctx.closePath();
}

function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 if(shot){
   ctx.save();
   roundedRect(sx,sy,sw,sh,r);
   ctx.clip();

   // EXACT object-fit: cover calculation.
   const rw=shot.naturalWidth, rh=shot.naturalHeight;
   const target=sw/sh, source=rw/rh;
   let cx=0,cy=0,cw=rw,ch=rh;
   if(source>target){
      cw=rh*target;
      cx=(rw-cw)/2;
   }else{
      ch=rw/target;
      cy=(rh-ch)/2;
   }
   ctx.drawImage(shot,cx,cy,cw,ch,sx,sy,sw,sh);
   ctx.restore();
 }

 if(frame.complete) ctx.drawImage(frame,0,0,canvas.width,canvas.height);

 if(!shot){
   ctx.save();
   ctx.fillStyle="#999";
   ctx.font="56px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText("เลือก Screenshot",canvas.width/2,canvas.height/2-35);
   ctx.fillText("เพื่อใส่ใน iPhone",canvas.width/2,canvas.height/2+45);
   ctx.restore();
 }
}

frame.onload=render;

fileInput.addEventListener("change",e=>{
 const f=e.target.files[0];
 if(!f)return;
 const reader=new FileReader();
 reader.onload=ev=>{
   shot=new Image();
   shot.onload=render;
   shot.src=ev.target.result;
 };
 reader.readAsDataURL(f);
});

downloadBtn.addEventListener("click",()=>{
 if(!shot){alert("กรุณาเลือก Screenshot ก่อน");return;}
 // The downloaded PNG is this exact same canvas — no second rendering path.
 canvas.toBlob(blob=>{
   const a=document.createElement("a");
   const url=URL.createObjectURL(blob);
   a.href=url;
   a.download="iphone-screenshot-transparent.png";
   a.click();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 }, "image/png");
});

render();
</script>
